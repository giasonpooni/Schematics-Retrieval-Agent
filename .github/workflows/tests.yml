name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.10.10"
      - name: Run quickstart
        run: uv run --python ${{ matrix.python }} python examples/quickstart.py
      - name: Run unknown-plant example
        run: uv run --python ${{ matrix.python }} python examples/unknown_plant.py
      - name: Build package
        run: uv build --python ${{ matrix.python }}
      - name: Run default suite
        run: uv run --python ${{ matrix.python }} --dev pytest -q
